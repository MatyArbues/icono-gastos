<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f3a4d">
<meta name="apple-mobile-web-app-title" content="Gastos">
<title>Gastos</title>
<link rel="apple-touch-icon" href="icono-vela-180.png">
<link rel="icon" type="image/png" href="icono-vela-512.png">
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center; background: #0f3a4d; color: #fff;
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif; }
  img { width: 120px; height: 120px; border-radius: 26px; }
  h1 { margin: 0; font-size: 1.6rem; }
  p { margin: 0; max-width: 320px; opacity: 0.9; line-height: 1.4; }
  a.boton { display: inline-block; margin-top: 8px; padding: 16px 28px; border-radius: 14px; background: #fff; color: #0f3a4d;
    font-weight: 700; font-size: 1.1rem; text-decoration: none; }
</style>
</head>
<body>
  <img src="icono-vela-512.png" alt="">
  <h1>Gastos</h1>
  <p id="ayuda" hidden>Para dejarlo como ícono: tocá el botón Compartir de Safari y elegí Agregar a inicio.</p>
  <a class="boton" id="abrir" href="#">Abrir la app</a>

<script>
  // Pegá acá la dirección de la app (la que termina en /exec), entre las comillas
  const APP_URL = 'https://script.google.com/macros/s/AKfycbwtJPZxpEcm2m5Op6uozAlFBQIsmL57cvSW6dq7UcZSzq4nuy5_wR6sRUnGGaYtgGUc/exec';

  document.getElementById('abrir').href = APP_URL;
  if (new URLSearchParams(location.search).has('instalar')) {
    // Primera vez: no redirige, y deja la dirección limpia para que el acceso directo abra la app
    history.replaceState(null, '', location.pathname);
    document.getElementById('ayuda').hidden = false;
  } else {
    location.replace(APP_URL);
  }
</script>
</body>
</html>
